<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Restaurant Order Manager</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- Header -->

  <header class="bg-slate-900 text-white py-6">

    <div class="max-w-4xl mx-auto px-6">

      <h1 class="text-2xl font-bold">
        🍽️ Restaurant Order Manager
      </h1>

      <p class="text-slate-400 text-sm mt-1">
        Manage restaurant table orders
      </p>

    </div>

  </header>


  <main class="max-w-4xl mx-auto px-6 py-8">


    <!-- Add Order -->

    <div class="bg-white p-6 rounded-lg shadow mb-8">

      <h2 class="text-xl font-bold mb-4">
        Add Order
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

        <select id="table" class="input">

          <option value="">
            Select Table
          </option>

          <option value="Table 1">
            Table 1
          </option>

          <option value="Table 2">
            Table 2
          </option>

          <option value="Table 3">
            Table 3
          </option>

        </select>


        <select id="item" class="input">

          <option value="">
            Select Item
          </option>

        </select>


        <input
          id="price"
          class="input bg-gray-50"
          placeholder="Price"
          readonly
        >


        <button
          onclick="addOrder()"
          class="bg-orange-500 hover:bg-orange-600 text-white rounded-lg font-semibold"
        >
          Add Order
        </button>

      </div>

    </div>


    <!-- Table 1 -->

    <div class="table-box">

      <h2 class="table-title">
        Table 1
      </h2>

      <div id="table1Orders"></div>

    </div>


    <!-- Table 2 -->

    <div class="table-box">

      <h2 class="table-title">
        Table 2
      </h2>

      <div id="table2Orders"></div>

    </div>


    <!-- Table 3 -->

    <div class="table-box">

      <h2 class="table-title">
        Table 3
      </h2>

      <div id="table3Orders"></div>

    </div>


  </main>


  <script src="script.js"></script>

</body>

</html>
